[runtime]
sampler = test
root = /home/jacquemier/Working_dir/LSST/Cosmo-likelihood
resume = F

[default]
fatal_errors = F

[output]
filename = output_rp/number_counts_samples.txt
format = text
verbosity = 0

[pipeline]
modules = polynome likelihood
values = priors_file.ini 
quiet = F
debug = T
timing = T

[polynome]
file = /home/jacquemier/Working_dir/LSST/Cosmo-likelihood/src/cosmosishood/polynome.py
degree = 2
coefficients = coefficients


[power]
file = /home/jacquemier/Working_dir/LSST/Cosmo-likelihood/src/cosmosishood/power.py

[likelihood]
;; Fix this to use an environment variable to find the files.
;; Set FIRECROWN_DIR to the base of the firecrown installation (or build, if you haven't installed it)
file = /home/jacquemier/Working_dir/LSST/Cosmo-likelihood/src/cosmosishood/likelihood.py
noise_level = 1.

[test]
fatal_errors = T
save_dir = output_test

[metropolis]noise_level
samples = 1000
nsteps = 1

[emcee]
walkers = 100
samples = 50000
nsteps = 20

